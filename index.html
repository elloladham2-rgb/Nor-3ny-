<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Love • My Everything ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">
  <style>
    :root{
      --cream:#fff7ef; --paper:#fffdf9; --pink:#f3d6dc; --rose:#c95762;
      --rose2:#d96b73; --brown:#8c6258; --ink:#594744; --shadow:0 18px 50px rgba(126,77,65,.16);
    }
    *{box-sizing:border-box}
    body{margin:0;background:#f0e4dc;color:var(--ink);font-family:Cairo,system-ui,sans-serif}
    button,input{font:inherit}
    .phone{min-height:100vh;display:flex;justify-content:center}
    .app{width:min(100%,520px);min-height:100vh;background:var(--cream);position:relative;overflow:hidden}
    .screen{min-height:100vh;padding:30px 22px 38px;display:none}
    .screen.active{display:block;animation:fade .7s ease}
    @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

    /* Envelope */
    .lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
    .tiny{letter-spacing:5px;font-size:11px;color:#9c8279;margin-bottom:8px}
    .envelope{width:min(88%,390px);aspect-ratio:1.55/1;position:relative;margin:8px auto 38px;filter:drop-shadow(0 20px 20px rgba(104,71,60,.16))}
    .env-body{position:absolute;inset:0;background:#d9c1a5;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(120,88,69,.12)}
    .env-flap{position:absolute;inset:0;clip-path:polygon(0 0,50% 58%,100% 0);background:#efe1cd}
    .env-left,.env-right{position:absolute;bottom:0;width:50%;height:70%;background:#cdb291}
    .env-left{left:0;clip-path:polygon(0 100%,100% 0,0 0)}
    .env-right{right:0;clip-path:polygon(100% 100%,100% 0,0 0)}
    .seal{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:#b94845;border:7px solid #e2bca8;display:grid;place-items:center;overflow:hidden;box-shadow:0 4px 12px rgba(80,40,30,.18)}
    .seal img{width:100%;height:100%;object-fit:cover}
    .label{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:66%;padding:9px 6px;background:#fff8ef;box-shadow:0 4px 8px rgba(80,40,30,.08)}
    .label small{display:block;letter-spacing:5px;font-size:9px}
    .label strong{font-family:Parisienne,cursive;font-size:24px;direction:ltr;display:block}
    .label strong::after{content:" ❤️"}
    .hint{font-size:10px;letter-spacing:4px;color:#9d8178;margin-bottom:12px}
    .pass{width:min(82%,300px);padding:13px 18px;border:1px solid #eadbd1;border-radius:30px;background:#fffdfb;text-align:center;outline:none;box-shadow:0 3px 12px rgba(120,80,65,.07)}
    .pass:focus{border-color:#d89aa0}
    .unlock{margin-top:14px;border:0;border-radius:30px;padding:12px 34px;background:linear-gradient(135deg,#d95b62,#c53d3c);color:#fff;box-shadow:0 9px 20px rgba(190,68,67,.23);cursor:pointer}
    .error{height:20px;color:#b84d52;font-size:12px;margin-top:8px}

    /* Memory page */
    .top{padding-top:12px;text-align:center}
    .script{font-family:Parisienne,cursive;font-size:42px;direction:ltr}
    .subtitle{font-size:12px;color:#a2867d;letter-spacing:2px}
    .hero{margin:24px 0 18px;border-radius:25px;overflow:hidden;box-shadow:var(--shadow);position:relative}
    .hero img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
    .hero .veil{position:absolute;inset:auto 0 0;height:42%;background:linear-gradient(transparent,rgba(255,247,239,.96))}
    .heroText{position:absolute;bottom:20px;left:0;right:0;text-align:center}
    .heroText h2{margin:0;font-size:24px;font-weight:600}
    .heroText p{margin:2px 0 0;color:#a46c70;font-size:13px}

    .sectionTitle{text-align:center;margin:26px 0 12px;font-size:15px}
    .gallery{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    .card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(120,80,65,.09)}
    .card img{width:100%;aspect-ratio:1/1.12;display:block;object-fit:cover}
    .caption{padding:9px 10px 11px;text-align:center;font-size:12px}
    .wide{grid-column:1/-1}
    .wide img{aspect-ratio:16/10}

    .player{margin-top:18px;padding:12px 14px;background:rgba(255,255,255,.82);border:1px solid #eadbd2;border-radius:24px;box-shadow:0 10px 24px rgba(120,80,65,.08)}
    .track{display:flex;align-items:center;gap:10px}
    .cover{width:48px;height:48px;border-radius:50%;object-fit:cover}
    .meta{flex:1;min-width:0}
    .song{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .artist{font-size:10px;color:#a1847b}
    .play{width:42px;height:42px;border:0;border-radius:50%;background:#efccd2;color:#8d4f59;cursor:pointer}
    .bar{height:4px;border-radius:4px;background:#ead9d4;margin-top:10px;overflow:hidden}
    .fill{height:100%;width:0;background:#cb7379}
    .time{display:flex;justify-content:space-between;font-size:9px;color:#a58b82;margin-top:4px;direction:ltr}

    .footer{text-align:center;margin:28px 0 4px;color:#ad9188;font-size:10px;letter-spacing:2px}
    .hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
    .heart{position:absolute;bottom:-30px;animation:float 5s linear forwards;opacity:.75}
    @keyframes float{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
  </style>
</head>
<body>
<div class="phone"><main class="app">

  <section id="lockScreen" class="screen active">
    <div class="lock">
      <div class="tiny">LOVE</div>
      <div class="envelope">
        <div class="env-body"></div>
        <div class="env-left"></div><div class="env-right"></div>
        <div class="env-flap"></div>
        <div class="label"><small>LOVE</small><strong>my everything</strong></div>
        <div class="seal"><img src="assets/crop_14.jpg" alt=""></div>
      </div>
      <div class="hint">ENTER THE SECRET WORD</div>
      <input id="password" class="pass" type="password" placeholder="love" autocomplete="off">
      <button id="unlock" class="unlock">💕 Unlock 💕</button>
      <div id="error" class="error"></div>
    </div>
  </section>

  <section id="memoryScreen" class="screen">
    <div class="top">
      <div class="script">my love</div>
      <div class="subtitle">a little place made with love ❤️</div>
    </div>

    <div class="hero">
      <img src="assets/crop_30.jpg" alt="memory">
      <div class="veil"></div>
      <div class="heroText"><h2>بدناها 💕</h2><p>وأنت معايا 😍</p></div>
    </div>

    <div class="player">
      <div class="track">
        <img class="cover" src="assets/crop_38.jpg" alt="">
        <div class="meta"><div class="song">وأنت معايا 😍</div><div class="artist">our little song</div></div>
        <button id="play" class="play">▶</button>
      </div>
      <div class="bar"><div id="fill" class="fill"></div></div>
      <div class="time"><span id="current">0:00</span><span id="duration">0:00</span></div>
      <audio id="audio" preload="metadata" src="assets/song.mp3"></audio>
    </div>

    <h3 class="sectionTitle">فـاكرة الهدية دي 🥹💕</h3>
    <div class="gallery">
      <article class="card"><img src="assets/crop_38.jpg"><div class="caption">فـاكرة الهدية دي؟ 💗</div></article>
      <article class="card"><img src="assets/crop_46.jpg"><div class="caption">أجمل الذكريات 🌹</div></article>
      <article class="card wide"><img src="assets/crop_52.jpg"><div class="caption">كل تفصيلة هنا ليها حكاية ❤️</div></article>
      <article class="card"><img src="assets/crop_22.jpg"><div class="caption">لحظة صغيرة، بس غالية</div></article>
      <article class="card"><img src="assets/crop_14.jpg"><div class="caption">my everything 💕</div></article>
    </div>

    <div class="footer">MADE WITH LOVE • 2026</div>
  </section>

  <div class="hearts" id="hearts"></div>
</main></div>

<script>
const lock=document.getElementById('lockScreen');
const memory=document.getElementById('memoryScreen');
const pass=document.getElementById('password');
const error=document.getElementById('error');
const audio=document.getElementById('audio');
const play=document.getElementById('play');
const fill=document.getElementById('fill');
const current=document.getElementById('current');
const duration=document.getElementById('duration');

function unlock(){
  if(pass.value.trim().toLowerCase()==='love'){
    lock.classList.remove('active'); memory.classList.add('active');
    audio.play().catch(()=>{});
    play.textContent='Ⅱ';
    burst();
  }else{
    error.textContent='الكلمة السرية مش دي 💗';
    pass.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:260});
  }
}
document.getElementById('unlock').onclick=unlock;
pass.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});

play.onclick=()=>{
  if(audio.paused){audio.play();play.textContent='Ⅱ'}else{audio.pause();play.textContent='▶'}
};
audio.addEventListener('loadedmetadata',()=>duration.textContent=fmt(audio.duration));
audio.addEventListener('timeupdate',()=>{
  current.textContent=fmt(audio.currentTime);
  fill.style.width=(audio.currentTime/audio.duration*100||0)+'%';
});
audio.addEventListener('ended',()=>play.textContent='▶');
function fmt(s){if(!isFinite(s))return'0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function burst(){
  const box=document.getElementById('hearts');
  for(let i=0;i<18;i++){
    const h=document.createElement('span'); h.className='heart'; h.textContent=['💗','💕','💖','💘'][i%4];
    h.style.left=Math.random()*100+'%'; h.style.animationDelay=Math.random()*1.8+'s'; h.style.fontSize=(12+Math.random()*18)+'px';
    box.appendChild(h); setTimeout(()=>h.remove(),6500);
  }
}
</script>
</body>
</html>
