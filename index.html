<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lovely ❤️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,500&display=swap');
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#171313;font-family:Cairo,sans-serif;color:#433a37}body{overflow-x:hidden}.app{width:min(100%,430px);min-height:100vh;margin:auto;background:#fbf0e8;position:relative;overflow:hidden;box-shadow:0 0 35px #0006}.page{min-height:100vh;padding:28px 22px 125px;display:none;position:relative}.page.show{display:block;animation:in .65s ease both}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.tape{position:absolute;top:12px;left:50%;width:108px;height:30px;transform:translateX(-50%) rotate(-1deg);background:#e7d6c9cc;filter:blur(.1px)}
.lock{min-height:100vh;display:flex;align-items:center;flex-direction:column;padding-top:105px}.envelope{width:84%;height:245px;background:#d8c1a4;position:relative;margin-bottom:72px;box-shadow:0 15px 25px #80675022}.env-back{position:absolute;inset:0;background:linear-gradient(32deg,transparent 49%,#f7eee4 50%) ,linear-gradient(148deg,transparent 49%,#f7eee4 50%);opacity:.95}.env-front{position:absolute;left:0;right:0;bottom:0;border-left:50% solid transparent;border-right:50% solid transparent;border-bottom:120px solid #c7ad8b;z-index:2}.letter{position:absolute;z-index:4;top:15px;left:17%;right:17%;height:78px;background:#fffaf4;box-shadow:0 2px 8px #6d51411c;text-align:center;padding-top:9px}.letter .tiny{font-size:12px;letter-spacing:5px}.letter .love{font-family:'Playfair Display',serif;font-size:22px;font-style:italic}.seal{position:absolute;z-index:5;left:50%;top:62%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:#a84c3f;border:4px solid #d6a46d;display:grid;place-items:center;color:#fff;font-size:27px;box-shadow:0 3px 8px #55302655}.star{position:absolute;right:18px;top:18px;background:#fff8ef;padding:9px 12px;color:#9f6c50}
.secret{font-size:11px;letter-spacing:4px;margin-bottom:15px;color:#8e817b}.pass{width:75%;height:47px;border-radius:28px;border:1px solid #eadfd8;background:#fffdfb;text-align:center;font:inherit;outline:0}.unlock{margin-top:14px;border:0;background:#df5b55;color:#fff;border-radius:30px;padding:13px 42px;font:600 15px Cairo;box-shadow:0 9px 18px #b34d4935;cursor:pointer}.error{height:24px;font-size:12px;color:#b74e49;margin-top:8px}
.paper{background:#fffdfa;min-height:calc(100vh - 155px);border:1px solid #f0e6df;box-shadow:0 6px 18px #9d7e6a18;padding:82px 30px 45px;position:relative}.paper:before{content:"";position:absolute;top:54px;left:15%;right:15%;border-top:1px dashed #eaded5}.emoji{font-size:42px;text-align:center;margin-bottom:45px}.type{font-size:24px;line-height:2.25;text-align:center;min-height:180px}.next{display:block;margin:35px auto 0;border:1px solid #d6afb0;background:#f5dce0;color:#332d2c;border-radius:35px;padding:14px 44px;font:italic 600 16px 'Playfair Display';cursor:pointer}.dots{margin-top:18px;text-align:center;color:#cdb8b0;letter-spacing:4px;font-size:12px}
.galleryPage{background:#f1dfd4}.heading{text-align:center;padding:35px 0 20px}.heading h2{font-size:28px;margin:0;color:#5b4640}.heading p{margin:3px 0;color:#a88e85}.heartfield{position:absolute;inset:0;pointer-events:none;overflow:hidden}.heartfield span{position:absolute;color:#8f5b3f;font-size:25px;animation:drift 7s linear infinite}@keyframes drift{from{transform:translateY(30px) rotate(-10deg);opacity:.15}20%{opacity:.7}to{transform:translateY(-105vh) rotate(35deg);opacity:0}}
.memories{display:grid;gap:18px}.card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 20px #74574717;position:relative}.card img{width:100%;height:360px;object-fit:cover;display:block;filter:saturate(.88)}.card .caption{padding:14px;text-align:center;font-size:16px}.card.big img{height:510px}.sectionBtn{display:block;margin:25px auto 0;border:0;background:#f4cad4;color:#654d4b;border-radius:30px;padding:12px 35px;font:600 15px Cairo;cursor:pointer}
.finalBox{margin-top:25px;background:#fffdf9;border-radius:26px;padding:48px 35px;box-shadow:0 8px 20px #74574718;text-align:center;line-height:2.4;font-size:20px}.finalBox .bigheart{font-size:50px;margin-bottom:18px}.lovely{font-family:'Playfair Display',serif;color:#cf9aa0;font-size:30px;margin-top:25px}.back{position:fixed;bottom:94px;left:50%;transform:translateX(-50%);z-index:8;border:0;border-radius:30px;background:#f2cad2;color:#5e4946;padding:10px 26px;font:600 14px Cairo}
.player{position:fixed;z-index:20;bottom:12px;left:50%;transform:translateX(-50%);width:min(calc(100% - 26px),404px);height:76px;background:#fffaf8f2;border:1px solid #ead9d1;border-radius:25px;box-shadow:0 10px 30px #6c514226;backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding:9px 12px}.disc{width:48px;height:48px;border-radius:50%;background:url('assets/memory2.jpg') center/cover;flex:none}.ctrl{width:32px;height:32px;border:0;border-radius:50%;background:#f0cbd1;color:#594b48;cursor:pointer}.info{flex:1;min-width:0;text-align:right}.info b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info small{display:block;color:#ad9690;font-size:10px}.bar{height:4px;border-radius:4px;background:#e7d7d0;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#df9fa9}.time{font-size:9px;color:#b8a29b;white-space:nowrap}
.toast{position:fixed;z-index:50;top:25px;left:50%;transform:translateX(-50%) translateY(-80px);background:#fffaf7;color:#624c47;border-radius:30px;padding:10px 20px;box-shadow:0 8px 25px #0002;transition:.4s;font-size:12px}.toast.on{transform:translateX(-50%) translateY(0)}
@media(max-width:360px){.type{font-size:20px}.envelope{height:210px}.card img{height:300px}.card.big img{height:430px}}
</style></head>
<body>
<div class="app">
<div id="toast" class="toast">💗</div>
<section id="p0" class="page show"><div class="tape"></div><div class="lock">
 <div class="envelope"><div class="env-back"></div><div class="letter"><div class="tiny">LOVE</div><div class="love">my everything ❤️</div></div><div class="star">★</div><div class="seal">💗</div><div class="env-front"></div></div>
 <div class="secret">ENTER THE SECRET WORD</div><input id="pass" class="pass" value="love"><button class="unlock" onclick="unlock()">💗 Unlock 💗</button><div id="err" class="error"></div>
 </div></section>
<section id="p1" class="page"><div class="tape"></div><div class="paper"><div class="emoji">😍</div><div id="type" class="type"></div><button class="next" onclick="go(2)">next →</button><div class="dots">•　1 / 2　••••••</div></div></section>
<section id="p2" class="page galleryPage"><div class="heartfield" id="hearts"></div><div class="heading"><h2>بدايتنا 💕</h2><p>وأجمل ذكرياتنا مع بعض</p></div><div class="memories">
 <div class="card"><img src="assets/memory1.jpg"><div class="caption">بحبك ❤️</div></div>
 <div class="card big"><img src="assets/memory2.jpg"><div class="caption">ربنا يخليكي ليا 💗</div></div>
 <div class="card big"><img src="assets/memory3.jpg"><div class="caption">وجودك بيخلّي كل حاجة أحلى</div></div>
 <div class="card big"><img src="assets/memory4.jpg"><div class="caption">يوم متنسيش 😂❤️</div></div>
 </div><button class="sectionBtn" onclick="go(3)">memories 🔄</button></section>
<section id="p3" class="page galleryPage"><div class="heartfield" id="hearts2"></div><div class="heading"><div style="font-size:42px">💖</div></div><div class="finalBox"><div class="bigheart">💗✨</div><div>بحبك أوي</div><div>ربنا يخليكي ليا</div><div>وعايزين بقا نمله صور كتير متنسيش 😂</div><div class="lovely">💗 Lovely 💗</div></div><button class="sectionBtn" onclick="go(2)">← memories</button></section>
<div class="player"><div class="disc"></div><button class="ctrl" id="prev">‹</button><button class="ctrl" id="play" onclick="toggle()">▶</button><button class="ctrl" id="next">›</button><div class="info"><b>وانتِ معايا 😍</b><small id="songname">Our memory</small><div class="bar"><i id="prog"></i></div></div><div class="time" id="time">0:00</div></div>
</div>
<audio id="audio" src="assets/song.mp3" preload="auto"></audio>
<script>
const pages=[...document.querySelectorAll('.page')],audio=document.getElementById('audio'),play=document.getElementById('play'),prog=document.getElementById('prog'),time=document.getElementById('time');
const msg='حبيت أعمل هدية جديدة وعايزين نمله\nصورنا بقا بس قبل أي حاجة عايز تعرفي\nإني بحبك وربنا يخليكي ليا يا قلبي ويا ❤️';
let typing;
function go(n){pages.forEach((p,i)=>p.classList.toggle('show',i===n)); if(n===1)typeMsg(); if(n===2||n===3)spawnHearts(n===2?'hearts':'hearts2'); window.scrollTo({top:0,behavior:'smooth'});}
function unlock(){if(document.getElementById('pass').value.trim().toLowerCase()==='love'){go(1);audio.play().catch(()=>{});toast('💗 Welcome');}else{document.getElementById('err').textContent='الكلمة السرية مش صحيحة';}}
function typeMsg(){clearInterval(typing);let i=0,el=document.getElementById('type');el.innerHTML='';typing=setInterval(()=>{el.innerHTML=msg.slice(0,i).replaceAll('\n','<br>');i++;if(i>msg.length)clearInterval(typing)},42)}
function toggle(){if(audio.paused){audio.play();play.textContent='Ⅱ'}else{audio.pause();play.textContent='▶'}}
audio.addEventListener('timeupdate',()=>{if(audio.duration){prog.style.width=(audio.currentTime/audio.duration*100)+'%';let s=Math.floor(audio.currentTime);time.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}});
audio.addEventListener('play',()=>play.textContent='Ⅱ');audio.addEventListener('pause',()=>play.textContent='▶');
function spawnHearts(id){const el=document.getElementById(id);if(el.dataset.done)return;el.dataset.done=1;for(let i=0;i<24;i++){let s=document.createElement('span');s.textContent=['♡','♥','🤎','💕'][i%4];s.style.left=Math.random()*100+'%';s.style.bottom=(-10-Math.random()*80)+'px';s.style.animationDelay=Math.random()*5+'s';s.style.animationDuration=(5+Math.random()*5)+'s';el.appendChild(s)}}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('on');setTimeout(()=>x.classList.remove('on'),1800)}
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
</script></body></html>
